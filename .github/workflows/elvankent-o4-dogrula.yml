# Elvankent Gayrimenkul — O-4 doğrulaması: TEK bir kod ağacı (taban ya da aday) için tam test kümesi.
# Yalnız elvankent-o4-hazirlik.yml çağırır (workflow_call). Testler yalnız CI içinde kurulan yerel Supabase'e bağlanır;
# hiçbir sır kullanılmaz; artifact yüklenmez. E2E başarısızlıkları bu işi düşürmez: test adları ve durumları "e2e" çıktısıyla
# karşılaştırma işine aktarılır (taban ↔ aday). E2E dışındaki her adım (ve adayda npm audit) yeşil olmalıdır.
name: elvankent-o4-dogrula

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      variant:
        type: string
        required: true
      expected_tree:
        type: string
        default: ''
      audit:
        type: boolean
        default: false
    outputs:
      e2e:
        description: 'base64 JSON: { total, failed: [test adı] }'
        value: ${{ jobs.verify.outputs.e2e }}

permissions:
  contents: read

defaults:
  run:
    working-directory: elvankent-gayrimenkul

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: ${{ inputs.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      e2e: ${{ steps.e2e.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Kod ağacı
        working-directory: .
        env:
          REF: ${{ inputs.ref }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$REF" ] || { echo "::error::checkout $REF değil"; exit 1; }
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "Commit $REF · ağaç $tree"
          if [ -n "$EXPECTED_TREE" ] && [ "$tree" != "$EXPECTED_TREE" ]; then echo "::error::ağaç $EXPECTED_TREE değil"; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: elvankent-gayrimenkul/package-lock.json
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Birim testleri
        run: npm run test:unit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://ci.example.com
          SITE_ENV: development
        run: npm run build
      - name: Bağımlılık güvenlik taraması (yüksek/kritik; bastırma yok)
        if: ${{ inputs.audit }}
        run: npm audit --omit=dev --audit-level=high
      - name: Yerel Supabase (migration'lar sıfırdan uygulanır)
        run: |
          set -euo pipefail
          mv supabase/seed.sql /tmp/seed.sql
          [ -f supabase/config.toml ] || supabase init --force
          sed -i '/^\[auth.mfa.totp\]/,/^\[/ { s/enroll_enabled = false/enroll_enabled = true/; s/verify_enabled = false/verify_enabled = true/ }' supabase/config.toml
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
          supabase status -o env > /tmp/supa.env
          set -a; . /tmp/supa.env; set +a
          PGOPTIONS='-c app.allow_demo_seed=on' psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f /tmp/seed.sql
          # Test ortamı elvankent-security-candidate ile aynı (K-10/K-11 düzeltmeleri; değerler tek tırnakla)
          env_line() {
            case "$2" in *"'"* | *$'\n'* | *$'\r'*) echo "::error::.env.local: $1 değeri tek tırnakla yazılamaz" >&2; return 1 ;; esac
            printf "%s='%s'\n" "$1" "$2"
          }
          {
            env_line NEXT_PUBLIC_SUPABASE_URL "$API_URL"
            env_line NEXT_PUBLIC_SUPABASE_ANON_KEY "$ANON_KEY"
            env_line SUPABASE_SERVICE_ROLE_KEY "$SERVICE_ROLE_KEY"
            env_line NEXT_PUBLIC_SITE_URL http://localhost:3000
            env_line IP_HASH_SALT "ci-$(openssl rand -hex 16)"
            env_line CRON_SECRET "ci-$(openssl rand -hex 32)"
            env_line NEXT_IMAGE_ALLOW_LOCAL_IP 1
            env_line SITE_ENV demo
            env_line EMAIL_PROVIDER resend
            env_line RESEND_API_KEY ci-test-key
            env_line RESEND_API_BASE http://127.0.0.1:4010
            env_line EMAIL_FROM 'KARAY CI <davet@example.test>'
            env_line DOMAIN_DNS_RESOLVER_URL http://127.0.0.1:4011/dns-query
            env_line DOMAIN_TARGET_CNAME sites.karay.test
            env_line DOMAIN_TARGET_A 203.0.113.10
          } > .env.local
      - name: Birim + güvenlik testleri (RLS, MFA, kiracı izolasyonu)
        run: npm test
      - name: E2E hazırlık (yönetici hesabı, build, sunucu)
        run: |
          set -euo pipefail
          npm run create-admin -- e2e-admin@example.test 'E2e-Password-12345' --role=owner --super-admin
          npx playwright install --with-deps chromium
          set -a; . ./.env.local; set +a
          npm run build
          (npm start > /tmp/next.log 2>&1 &)
          timeout 60 bash -c 'until curl -fs -o /dev/null http://localhost:3000/api/health; do sleep 1; done'
      - name: Playwright E2E (sonuç tabanla karşılaştırılır)
        id: e2e
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.test
          E2E_ADMIN_PASSWORD: E2e-Password-12345
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/e2e.json
        run: |
          set -uo pipefail
          code=0
          npx playwright test --reporter=json,list || code=$?
          echo "Playwright çıkış kodu: $code (karşılaştırma işi tabanla kıyaslar)"
          test -s /tmp/e2e.json || { echo "::error::E2E sonuç dosyası yok"; exit 1; }
          summary=$(node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/e2e.json", "utf8"));
            const failed = []; let total = 0;
            const walk = (s, trail) => {
              for (const sp of s.specs ?? []) for (const t of sp.tests ?? []) {
                total += 1;
                if (t.status === "unexpected") failed.push(`${sp.file} › ${[...trail, sp.title].join(" › ")} [${t.projectName}]`);
              }
              for (const c of s.suites ?? []) walk(c, c.title && !/\.(ts|js)$/.test(c.title) ? [...trail, c.title] : trail);
            };
            for (const s of d.suites ?? []) walk(s, []);
            console.error(`E2E: ${total} test, ${failed.length} başarısız`);
            process.stdout.write(Buffer.from(JSON.stringify({ total, failed: failed.sort() })).toString("base64"));
          ')
          echo "e2e=$summary" >> "$GITHUB_OUTPUT"
