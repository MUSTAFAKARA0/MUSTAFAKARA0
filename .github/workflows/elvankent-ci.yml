# Elvankent Gayrimenkul — sürekli entegrasyon
#
# quality  (her push / PR): kurulum, typecheck, lint, birim testleri, production build,
#                           bağımlılık güvenlik taraması, gizli anahtar taraması
# database (isteğe bağlı):  CI içinde yerel Supabase (Docker) kurar; tüm migration'ları
#                           sıfırdan uygular, demo verisini yükler, güvenlik (RLS/MFA/kiracı
#                           izolasyonu) ve Playwright E2E testlerini çalıştırır.
#                           Açmak için: Settings › Variables › ELVANKENT_CI_DB_TESTS = true
#
# Production'a geçişi engellemek: main (veya production) dalı için branch protection'da
# "quality" (ve açıldıysa "database") işlerini "required status check" yapın; Vercel'de
# production dağıtımını yalnızca bu korumalı daldan yapın (docs/DEPLOYMENT_RUNBOOK.md).
#
# Çalıştırıcı imajı sabittir: ubuntu-24.04. ubuntu-latest etiketi 19.10.2026'dan itibaren Ubuntu 26'ya
# taşınıyor; iki iş de en son ubuntu-24.04 imajında doğrulandı. İmaj, CI'da doğrulanarak ayrı bir
# commit'le değiştirilir (tests/unit/launch-readiness.test.mjs, LR-09).
#
# Tedarik zinciri (LR-11): action'lar tam commit SHA'sıyla sabitlenir (sürüm yanındaki yorumda; etiket
# taşınsa da çalışan kod değişmez) ve hepsi node24 çalışma zamanındadır. Supabase CLI sürümü sabittir;
# gitleaks arşivi resmî SHA-256 özetiyle doğrulanır; sunucu beklemesi çalışma anında paket indirmez.
# Güncelleme: yeni sürümün SHA'sı `git ls-remote` ile alınır, CI'da yeşil görülür, ayrı commit'le değişir.
name: elvankent-ci

on:
  push:
    paths: ['elvankent-gayrimenkul/**', '.github/workflows/elvankent-ci.yml']
  pull_request:
    paths: ['elvankent-gayrimenkul/**', '.github/workflows/elvankent-ci.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: elvankent-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: elvankent-gayrimenkul

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Build veritabanına bağlanmaz; yer tutucu değerler yeterlidir (gizli değer değildir)
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: https://ci.example.com
      SITE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: elvankent-gayrimenkul/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Birim testleri
        run: npm run test:unit
      - name: Demo SQL dosyaları migration'larla güncel mi
        run: npm run demo:sql -- --check
      - name: Production build
        run: npm run build
      - name: Bağımlılık güvenlik taraması (production bağımlılıkları, yüksek/kritik)
        run: npm audit --omit=dev --audit-level=high
      - name: Gizli anahtar taraması (gitleaks)
        working-directory: .
        run: |
          # Sürüm ve arşiv özeti sabit (resmî gitleaks_8.24.2_checksums.txt); özet tutmazsa iş durur
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          echo 'fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  gitleaks_8.24.2_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.24.2_linux_x64.tar.gz gitleaks
          # Proje klasörüne dokunan tüm commit'ler taranır (node_modules/.next değil)
          ./gitleaks git . --log-opts="-- elvankent-gayrimenkul" --no-banner --redact --exit-code 1

  database:
    if: ${{ vars.ELVANKENT_CI_DB_TESTS == 'true' }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: elvankent-gayrimenkul/package-lock.json
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # 19.10.2026'daki son kararlı sürüm (CI #83 o gün "latest" ile yeşildi). `supabase init`
          # şablonu sürüme göre değişebildiği için sabit; yeni sürüm CI'da doğrulanıp ayrı commit'le seçilir.
          version: 2.121.0
      - run: npm ci
      - name: Yerel Supabase (migration'lar sıfırdan uygulanır)
        run: |
          set -euo pipefail
          # Demo seed'i açık onay ister; start sırasında otomatik çalışmasın diye kenara alınır
          mv supabase/seed.sql /tmp/seed.sql
          [ -f supabase/config.toml ] || supabase init --force
          # TOTP MFA testleri için doğrulayıcıyı aç
          sed -i '/^\[auth.mfa.totp\]/,/^\[/ { s/enroll_enabled = false/enroll_enabled = true/; s/verify_enabled = false/verify_enabled = true/ }' supabase/config.toml
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
          supabase status -o env > /tmp/supa.env
          set -a; . /tmp/supa.env; set +a
          PGOPTIONS='-c app.allow_demo_seed=on' psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f /tmp/seed.sql
          # Bekleyen migration'lar (supabase/pending, canlıya uygulanmaz): bayraklar varsayılan kapalı; RLS ve E2E
          # testleri bunlar uygulanmış veritabanında koşar (geriye uyumluluk) ve yeni davranışı sınar
          for f in supabase/pending/*.sql; do psql "$DB_URL" -X -v ON_ERROR_STOP=1 -q -f "$f"; done
          # .env.local'ı hem Node (create-admin, RLS testleri, Playwright) hem bash ("E2E hazırlık": . ./.env.local)
          # okur. Her değer tek tırnakla yazılır; tek tırnak veya satır sonu içeren değer yazılmaz. Yazımdan sonra
          # iki tarafın aynı değerleri okuduğu denetlenir (K-11: tırnaksız EMAIL_FROM=Ad <e-posta> satırını Node
          # metin olarak okuyordu, bash yönlendirme sanıp adımı düşürüyordu).
          env_line() {
            case "$2" in *"'"* | *$'\n'* | *$'\r'*) echo "::error::.env.local: $1 değeri tek tırnakla yazılamaz" >&2; return 1 ;; esac
            printf "%s='%s'\n" "$1" "$2"
          }
          {
            env_line NEXT_PUBLIC_SUPABASE_URL "$API_URL"
            env_line NEXT_PUBLIC_SUPABASE_ANON_KEY "$ANON_KEY"
            env_line SUPABASE_SERVICE_ROLE_KEY "$SERVICE_ROLE_KEY"
            env_line NEXT_PUBLIC_SITE_URL http://localhost:3000
            env_line IP_HASH_SALT "ci-$(openssl rand -hex 16)"
            env_line CRON_SECRET "ci-$(openssl rand -hex 32)"
            env_line NEXT_IMAGE_ALLOW_LOCAL_IP 1
            # E2E demo ortamını bekler (DEMO ORTAMI şeridi, noindex; demo verisi yukarıda yüklenir):
            # tests/e2e/acceptance.spec.ts ve visitor.spec.ts. Yerel çalıştırmalarla aynı ortam.
            env_line SITE_ENV demo
            # P0.4 davet e-postası: gerçek gönderim yok; E2E sahte Resend sunucusunu (127.0.0.1:4010) kendisi açar
            env_line EMAIL_PROVIDER resend
            env_line RESEND_API_KEY ci-test-key
            env_line RESEND_API_BASE http://127.0.0.1:4010
            env_line EMAIL_FROM 'KARAY CI <davet@example.test>'
            # P0.5 özel alan adı: gerçek DNS yok; E2E sahte DoH sunucusunu (127.0.0.1:4011) kendisi açar
            env_line DOMAIN_DNS_RESOLVER_URL http://127.0.0.1:4011/dns-query
            env_line DOMAIN_TARGET_CNAME sites.karay.test
            env_line DOMAIN_TARGET_A 203.0.113.10
          } > .env.local
          node scripts/check-env-file.mjs .env.local
      - name: Birim + güvenlik testleri (RLS, MFA, kiracı izolasyonu)
        run: npm test
      - name: E2E hazırlık (yönetici hesabı, build, sunucu)
        run: |
          set -euo pipefail
          # E2E yöneticisi hem ofis sahibi hem KARAY süper admini olmalı (acceptance.spec.ts ön koşulu;
          # /platform testleri bu hesapla giriş yapar)
          npm run create-admin -- e2e-admin@example.test 'E2e-Password-12345' --role=owner --super-admin
          npx playwright install --with-deps chromium
          set -a; . ./.env.local; set +a
          npm run build
          (npm start > /tmp/next.log 2>&1 &)
          # Sunucu hazır olana kadar en fazla 60 sn beklenir; çalışma anında paket indirilmez
          timeout 60 bash -c 'until curl -fs -o /dev/null http://localhost:3000/api/health; do sleep 1; done'
      - name: Playwright E2E
        env:
          E2E_ADMIN_EMAIL: e2e-admin@example.test
          E2E_ADMIN_PASSWORD: E2e-Password-12345
        run: npx playwright test
      - name: Hata ayıklama çıktıları
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            elvankent-gayrimenkul/test-results
            /tmp/next.log
          retention-days: 7
