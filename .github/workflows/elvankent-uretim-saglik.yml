# Elvankent Gayrimenkul — production sağlık kontrolü (YALNIZ OKUMA)
#
# Herkese açık production adresine yalnız GET istekleri atar: /api/health (uygulama + veritabanı bağlantısı), ana sayfa,
# KARAY-01 (/karay görselleri, /platform/giris logosu ve simgeleri; yönlendirmesiz 200 image/*),
# /satilik ilan listesi, bir ilan ayrıntısı ve görselleri. Production alias'ının hangi dağıtımı sunduğunu, sayfadaki Next.js
# derleme kimliğini yeni ve eski dağıtımın kendi adresleriyle karşılaştırarak gösterir.
# Hiçbir şey yazmaz, giriş yapmaz, form göndermez, sır kullanmaz, artifact yüklemez. Günlüğe yalnız HTTP kodu, içerik türü,
# sayı ve derleme kimliği yazılır (sayfa içeriği, ilan yolu, kayıt yazılmaz). Kırmızı = rapor; geri dönüş kararı sahibindir.
name: elvankent-uretim-saglik

on:
  push:
    branches: ['claude/karays-mission-control-vn8g65']
    paths: ['.github/workflows/elvankent-uretim-saglik.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  saglik:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROD: https://mustafakara-0-7hh3.vercel.app
      # KARAY-01 yayını (74013a5) ve önceki production (650fd4e) dağıtımlarının kendi adresleri (GitHub dağıtım kaydından)
      NEW_DEPLOY: https://mustafakara-0-7hh3-do02vsewt-kara-6892.vercel.app
      OLD_DEPLOY: https://mustafakara-0-7hh3-8u946k8to-kara-6892.vercel.app
    steps:
      - name: Sağlık ve temel sayfalar
        run: |
          # Actions varsayılanı bash -e: bulunamayan desen (grep 1) betiği durdurmasın; hatalar bad() ile toplanır (ilk koşu)
          set +e -uo pipefail
          fail=0
          T=$(mktemp -d)
          bad() { echo "::error title=Production sağlık::$1"; fail=1; }
          # Her istekten önce gövde temizlenir: başarısız istek önceki sayfanın gövdesini karşılaştırmada bırakmasın
          get() { : > "$T/body"; : > "$T/head"; curl -sS -L --max-time 20 -A 'KARAYS-saglik-kontrolu' -o "$T/body" -D "$T/head" -w '%{http_code} %{content_type}' "$1" 2>/dev/null || echo "000 -"; }
          build_id() { { grep -oE '/_next/static/[A-Za-z0-9_-]{8,}/_(buildManifest|ssgManifest)' "$T/body" || grep -oE '"buildId":"[A-Za-z0-9_-]{8,}"' "$T/body"; } | head -1 | sed -E 's#^/_next/static/([^/]+)/.*#\1#; s#^"buildId":"([^"]+)"#\1#'; }
          # Derlemeye özgü iz: sayfanın yüklediği /_next/static/chunks dosya adlarının özeti (her derlemede değişir)
          # Next 16 (Turbopack) yolları /_next/static/chunks dışında da olabilir (koşu #2: 0 eşleşme): /_next/ altındaki
          # tüm .js/.css varlık yolları (yalnız derleme çıktısı; kullanıcı verisi değil) alınır
          assets() { grep -oE '/_next/[A-Za-z0-9/._~%-]+\.(js|css)' "$T/body" 2>/dev/null | sort -u; }
          chunks() { assets | sha256sum | cut -c1-16; }
          nchunks() { assets | wc -l; }
          abs() { case "$1" in http*) echo "$1" ;; /*) echo "$PROD$1" ;; *) echo "$PROD/$1" ;; esac; }
          {
            echo "### Production sağlık kontrolü ($(date -u +%FT%TZ))"
            echo "| Kontrol | Sonuç |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          row() { echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"; echo "$1: $2"; }

          # 1) /api/health: uygulama + veritabanı (yalnız status/db/latency alanları)
          r=$(get "$PROD/api/health"); code=${r%% *}
          h=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("status"), d.get("db"), d.get("latencyMs"))' "$T/body" 2>/dev/null || echo "? ? ?")
          set -- $h
          row "/api/health" "HTTP $code · status=$1 · db=$2 · ${3} ms"
          [ "$code" = 200 ] && [ "$1" = ok ] && [ "$2" = ok ] || bad "/api/health 200/ok/db ok değil"

          # 2) Ana sayfa + hangi dağıtım (derleme kimliği karşılaştırması)
          r=$(get "$PROD/"); code=${r%% *}; prod_id=$(build_id); prod_ch=$(chunks); prod_n=$(nchunks)
          cp "$T/body" "$T/home"
          row "Ana sayfa /" "HTTP $code · ${r#* }"
          [ "$code" = 200 ] || bad "ana sayfa $code"
          r=$(get "$NEW_DEPLOY/"); new_code=${r%% *}; new_id=$(build_id); new_ch=$(chunks); new_n=$(nchunks)
          r=$(get "$OLD_DEPLOY/"); old_code=${r%% *}; old_id=$(build_id); old_ch=$(chunks); old_n=$(nchunks)
          row "Derleme izi (chunk adları özeti): production alias" "$prod_ch ($prod_n dosya)"
          row "Varlık yolu biçimi (ilk, yalnız dizin)" "$(cp "$T/home" "$T/body"; assets | head -1 | sed -E 's#[^/]+$#…#')"
          row "Derleme izi: yeni dağıtım" "HTTP $new_code · $new_ch ($new_n dosya)"
          row "Derleme izi: önceki dağıtım" "HTTP $old_code · $old_ch ($old_n dosya)"
          if [ "$new_n" -gt 0 ] && [ "$new_ch" = "$old_ch" ]; then
            # Koşu #3: iki dağıtım adresi AYNI sayfayı döndürdü (Vercel kimlik doğrulaması / deployment protection) → sonuçsuz
            row "Dağıtım adresleriyle karşılaştırma" "sonuçsuz: iki benzersiz adres de aynı koruma sayfasını döndürüyor"
          elif [ "$prod_n" -gt 0 ] && [ "$new_n" -gt 0 ]; then
            if [ "$prod_ch" = "$new_ch" ]; then row "Alias → dağıtım (derleme izi)" "yeni dağıtımla aynı"; else bad "alias derleme izi yeni dağıtımdan farklı"; fi
            if [ "$prod_ch" = "$old_ch" ]; then bad "alias derleme izi hâlâ önceki dağıtımla aynı"; fi
          fi
          # Kesin parmak izi: Next.js istemci çalışma zamanı sürümünü pakete gömer (dist/client/app-bootstrap.js:
          # const version = "16.4.3"). Alias'ın yüklediği herkese açık JS dosyalarında hangi sürüm geçiyor?
          v_new=0; v_old=0; nj=0
          while read -r a; do
            [ -z "$a" ] && continue; nj=$((nj + 1))
            curl -sS -L --max-time 20 -o "$T/js" "$PROD$a" 2>/dev/null || continue
            grep -q '"16\.4\.3"' "$T/js" && v_new=$((v_new + 1))
            grep -q '"16\.3\.6"' "$T/js" && v_old=$((v_old + 1))
          done < <(cp "$T/home" "$T/body"; assets | grep '\.js$' | head -40)
          row "Next.js sürüm parmak izi (alias JS, $nj dosya)" "\"16.4.3\": $v_new dosyada · \"16.3.6\": $v_old dosyada"
          if [ "$v_new" -gt 0 ] && [ "$v_old" = 0 ]; then row "Alias → sürüm" "**Next.js 16.4.3** (O-4 güvenlik yaması ve sonrası)"; else bad "alias Next.js 16.4.3 sunmuyor (16.4.3: $v_new, 16.3.6: $v_old)"; fi
          row "Derleme kimliği: production alias" "${prod_id:-okunamadı}"
          row "Derleme kimliği: 650fd4e dağıtımı" "${new_id:-okunamadı (HTTP $new_code; dağıtım adresi korumalı olabilir)}"
          row "Derleme kimliği: ff2f7da dağıtımı" "${old_id:-okunamadı (HTTP $old_code)}"
          if [ -n "$prod_id" ] && [ -n "$new_id" ]; then
            [ "$prod_id" = "$new_id" ] && row "Alias → dağıtım" "**650fd4e** (yeni dağıtımla aynı derleme)" || bad "production alias yeni dağıtımı sunmuyor"
          fi
          if [ -n "$prod_id" ] && [ -n "$old_id" ] && [ "$prod_id" = "$old_id" ]; then bad "production alias hâlâ ff2f7da derlemesini sunuyor"; fi

          # 3) Ana sayfa görselleri (ilk 6)
          imgs() { grep -oE '<img[^>]+src="[^"]+"' "$1" 2>/dev/null | sed -E 's/.*src="([^"]+)".*/\1/' | sed 's/&amp;/\&/g' | grep -v '^data:' | head -"$2"; }
          n=0; ok=0
          while read -r src; do [ -z "$src" ] && continue; n=$((n + 1)); r=$(get "$(abs "$src")"); case "$r" in "200 image/"*) ok=$((ok + 1)) ;; esac; done < <(imgs "$T/home" 6)
          row "Ana sayfa görselleri" "$ok / $n görsel 200 + image/*"
          [ "$n" -gt 0 ] && [ "$ok" = "$n" ] || bad "ana sayfa görselleri: $ok/$n"

          # 4) İlan listesi ve bir ilan ayrıntısı + görselleri
          r=$(get "$PROD/satilik"); code=${r%% *}
          cp "$T/body" "$T/list"
          count=$(grep -oE 'href="/ilan/[^"#?]+"' "$T/list" | sort -u | wc -l)
          row "İlan listesi /satilik" "HTTP $code · $count ilan bağlantısı"
          [ "$code" = 200 ] && [ "$count" -gt 0 ] || bad "/satilik $code, $count ilan"
          first=$(grep -oE 'href="/ilan/[^"#?]+"' "$T/list" | head -1 | sed -E 's/href="([^"]+)"/\1/')
          if [ -n "$first" ]; then
            r=$(get "$PROD$first"); code=${r%% *}
            cp "$T/body" "$T/detail"
            row "İlan ayrıntısı (ilk ilan)" "HTTP $code"
            [ "$code" = 200 ] || bad "ilan ayrıntısı $code"
            n=0; ok=0
            while read -r src; do [ -z "$src" ] && continue; n=$((n + 1)); r=$(get "$(abs "$src")"); case "$r" in "200 image/"*) ok=$((ok + 1)) ;; esac; done < <(imgs "$T/detail" 6)
            row "İlan görselleri" "$ok / $n görsel 200 + image/*"
            [ "$n" -gt 0 ] && [ "$ok" = "$n" ] || bad "ilan görselleri: $ok/$n"
          fi

          # 5) KARAY-01: /karay ekran görüntüleri + logolar ve platform giriş sayfası logosu/simgeleri oturumsuz ziyaretçide
          #    görsel olarak (yönlendirmesiz) yüklenmeli. Yönlendirme izlenmez: /platform/x.svg giriş sayfasına 307 dönüyordu.
          getnr() { : > "$T/body"; curl -sS --max-time 20 -A 'KARAYS-saglik-kontrolu' -o "$T/body" -w '%{http_code} %{content_type}' "$1" 2>/dev/null || echo "000 -"; }
          karay_check() { # ad, sayfa yolu
            local name=$1 page=$2 code n=0 ok=0 bad_list="" src r
            r=$(get "$PROD$page"); code=${r%% *}; cp "$T/body" "$T/kp"
            [ "$code" = 200 ] || { row "$name" "sayfa HTTP $code"; bad "$name sayfası $code"; return; }
            # img src + favicon/apple-touch simgeleri
            { grep -oE '<img[^>]+src="[^"]+"' "$T/kp" | sed -E 's/.*src="([^"]+)".*/\1/'
              grep -oE '<link[^>]+rel="(icon|apple-touch-icon)"[^>]*>' "$T/kp" | grep -oE 'href="[^"]+"' | sed -E 's/href="([^"]+)"/\1/'; } 2>/dev/null \
              | sed 's/&amp;/\&/g' | grep -v '^data:' | sort -u > "$T/klist"
            while read -r src; do
              [ -z "$src" ] && continue; n=$((n + 1)); r=$(getnr "$(abs "$src")")
              case "$r" in "200 image/"*) ok=$((ok + 1)) ;; *) bad_list="$bad_list ${r%% *}" ;; esac
            done < "$T/klist"
            row "$name" "HTTP $code · $ok / $n görsel+simge 200 image/* (yönlendirmesiz)${bad_list:+ · başarısız kodlar:$bad_list}"
            [ "$n" -gt 0 ] && [ "$ok" = "$n" ] || bad "$name: $ok/$n görsel+simge"
          }
          karay_check "KARAY-01 /karay (ekran görüntüleri, logolar, simgeler)" /karay
          karay_check "KARAY-19 /platform/giris (logo, simgeler)" /platform/giris
          # Ekran görüntüleri statik import ile /_next/static/media altından gelmeli (74013a5); eski yol /karay/ekran-*.png
          r=$(get "$PROD/karay")
          if grep -q '_next/static/media/ekran-kontrol-merkezi' "$T/body"; then row "/karay ekran görüntüsü kaynağı" "/_next/static/media (KARAY-01 düzeltmesi yayında)"; else row "/karay ekran görüntüsü kaynağı" "eski /karay/ yolu (düzeltme yayında değil)"; fi
          rm -rf "$T"
          exit "$fail"
